<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orbit: job application tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0e1f;--ink:#e8ebff;--mute:#8f96c4;--line:rgba(160,170,255,.2);--glass:rgba(18,23,52,.7);--blue:#4cc9f0;--rose:#ff6b8b}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:radial-gradient(ellipse at 50% 30%,#151b40,#0a0e1f 70%);color:var(--ink);font:16px/1.5 'DM Sans',system-ui,sans-serif;overflow:hidden}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
header{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:18px 24px;z-index:5;gap:12px}
h1,h2{font-family:'Bricolage Grotesque',sans-serif;letter-spacing:-.02em;margin:0}
h1{font-size:28px}
.sub{color:var(--mute);font-size:14px}
.btns{display:flex;gap:8px}
button{font:inherit;cursor:pointer;border-radius:999px;border:1px solid var(--line);background:var(--glass);color:var(--ink);padding:9px 18px;backdrop-filter:blur(10px);transition:transform .15s,border-color .15s}
button:hover{border-color:var(--blue);transform:translateY(-1px)}
button.primary{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:500}
button.danger{color:var(--rose);border-color:rgba(255,107,139,.4)}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.col{position:fixed;z-index:4;transform:translateX(-50%);text-align:center;pointer-events:none;white-space:nowrap}
.col b{display:block;font:500 15px 'Bricolage Grotesque',sans-serif}
.col i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
.col span{font-size:13px;color:var(--mute)}
#tip{position:fixed;left:0;top:0;z-index:9;pointer-events:none;background:var(--glass);border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:14px;backdrop-filter:blur(10px)}
#empty{position:fixed;inset:0;display:grid;place-content:center;justify-items:center;gap:12px;z-index:3;pointer-events:none;text-align:center}
#empty button{pointer-events:auto}
#drawer{position:fixed;top:76px;right:16px;bottom:16px;width:min(320px,calc(100% - 32px));z-index:6;background:var(--glass);border:1px solid var(--line);border-radius:18px;padding:16px;overflow:auto;backdrop-filter:blur(14px)}
#drawer button{display:block;width:100%;text-align:left;border-radius:12px;margin-top:8px}
#drawer small{color:var(--mute);display:block}
#drawer h2{font-size:18px}
dialog{border:1px solid var(--line);border-radius:20px;background:#121734;color:var(--ink);padding:24px;width:min(440px,calc(100% - 24px))}
dialog::backdrop{background:rgba(5,8,20,.65);backdrop-filter:blur(4px)}
dialog form{display:grid;gap:12px}
label{display:grid;gap:4px;font-size:14px;color:var(--mute)}
input,select,textarea{font:inherit;color:var(--ink);background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:10px;padding:9px 11px}
select option{background:#121734}
.row{display:flex;gap:8px;justify-content:flex-end;margin-top:4px}
.row span{flex:1}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:20;background:var(--rose);color:#1a0a10;padding:10px 18px;border-radius:999px;font-weight:500}
@media(max-width:600px){h1{font-size:22px}.sub{display:none}.col b{font-size:12px}.col i{display:none}button{padding:8px 13px}}
</style>
</head>
<body>
<canvas id="c" aria-hidden="true"></canvas>
<header>
  <div><h1>Orbit</h1><div class="sub">Your job search, in motion</div></div>
  <div class="btns">
    <button id="listBtn" aria-expanded="false" aria-controls="drawer">List</button>
    <button id="addBtn" class="primary">Add application</button>
  </div>
</header>
<div id="empty" hidden><h2>No applications yet</h2><button class="primary" id="addBtn2">Add your first application</button></div>
<aside id="drawer" hidden aria-label="All applications"><h2>All applications</h2><div id="items"></div></aside>
<div id="tip" hidden></div>

<dialog id="dlg">
  <form id="f">
    <h2 id="dt">Add application</h2>
    <label>Company<input name="company" required></label>
    <label>Role<input name="role" required></label>
    <label>Status<select name="status">
      <option value="wishlist">Wishlist</option><option value="applied" selected>Applied</option>
      <option value="interview">Interview</option><option value="offer">Offer</option><option value="rejected">Rejected</option>
    </select></label>
    <label>Location<input name="location"></label>
    <label>Job link<input name="link" type="url" placeholder="https://"></label>
    <label>Applied on<input name="applied_on" type="date"></label>
    <label>Notes<textarea name="notes" rows="3"></textarea></label>
    <div class="row">
      <button type="button" id="del" class="danger" hidden>Delete</button><span></span>
      <button type="button" id="cancel">Cancel</button>
      <button class="primary">Save application</button>
    </div>
  </form>
</dialog>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const COLS=[['wishlist','Wishlist','#8b7cff'],['applied','Applied','#4cc9f0'],['interview','Interview','#ffb454'],['offer','Offer','#5ef2c2'],['rejected','Rejected','#ff6b8b']];
const $=s=>document.querySelector(s);
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const calm=matchMedia('(prefers-reduced-motion: reduce)').matches;
let jobs=[],spacing=3,unit=1,editing=null,hover=null,mx=0,my=0;

/* ---------- API ---------- */
async function api(path,method='GET',body){
  const r=await fetch('/api'+path,{method,headers:{'Content-Type':'application/json'},body:body&&JSON.stringify(body)});
  if(!r.ok)throw new Error(await r.text());
  return r.status===204?null:r.json();
}
const load=async()=>{try{jobs=await api('/jobs');layout()}catch{toast('Could not load applications. Is the server running?')}};
function toast(msg){const t=document.createElement('div');t.id='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),3500)}

/* ---------- 3D scene ---------- */
const scene=new THREE.Scene();
scene.fog=new THREE.FogExp2(0x0a0e1f,.03);
const cam=new THREE.PerspectiveCamera(50,1,.1,200);
cam.position.set(0,1.2,11);
const ren=new THREE.WebGLRenderer({canvas:$('#c'),antialias:true,alpha:true});
ren.setPixelRatio(Math.min(devicePixelRatio,2));
scene.add(new THREE.AmbientLight(0x8899ff,.55));
const sun=new THREE.DirectionalLight(0xffffff,.9);sun.position.set(3,6,5);scene.add(sun);

const sg=new THREE.BufferGeometry();
sg.setAttribute('position',new THREE.BufferAttribute(new Float32Array(1000*3).map(()=>(Math.random()-.5)*60),3));
const stars=new THREE.Points(sg,new THREE.PointsMaterial({size:.07,color:0xaab4ff,transparent:true,opacity:.7}));
scene.add(stars);

const rings=COLS.map(([,,c])=>{
  const g=new THREE.Group();
  const t=new THREE.Mesh(new THREE.TorusGeometry(1,.025,12,72),new THREE.MeshBasicMaterial({color:c}));t.rotation.x=Math.PI/2;
  const d=new THREE.Mesh(new THREE.CircleGeometry(1,48),new THREE.MeshBasicMaterial({color:c,transparent:true,opacity:.09}));d.rotation.x=-Math.PI/2;
  const dot=new THREE.Mesh(new THREE.SphereGeometry(.07,12,12),new THREE.MeshBasicMaterial({color:0xffffff}));dot.position.x=1;
  g.add(t,d,dot);g.position.y=-1.8;scene.add(g);return g;
});

const geo=new THREE.IcosahedronGeometry(.45,1),wgeo=new THREE.IcosahedronGeometry(.62,1);
const meshes=new Map();
function make(j){
  const m=new THREE.Mesh(geo,new THREE.MeshStandardMaterial({flatShading:true,metalness:.35,roughness:.3}));
  const w=new THREE.Mesh(wgeo,new THREE.MeshBasicMaterial({wireframe:true,transparent:true,opacity:.25}));
  w.raycast=()=>{};m.add(w);
  m.userData={w,ph:Math.random()*6.28};
  m.position.set((Math.random()-.5)*30,(Math.random()-.5)*14,-25-Math.random()*20); // fly-in start
  scene.add(m);meshes.set(j.id,m);return m;
}

const labs=COLS.map(([,l,c])=>{
  const d=document.createElement('div');d.className='col';
  d.innerHTML=`<b><i style="background:${c}"></i>${l}</b><span>0</span>`;
  document.body.appendChild(d);return d;
});

function layout(){
  const per=COLS.map(c=>jobs.filter(j=>j.status===c[0]).length);
  const step=Math.min(1.1*unit,5/Math.max(1,...per)),used=COLS.map(()=>0);
  jobs.forEach(j=>{
    const m=meshes.get(j.id)||make(j),ci=COLS.findIndex(c=>c[0]===j.status),col=COLS[ci][2];
    m.userData.job=j;
    m.userData.target=new THREE.Vector3((ci-2)*spacing,-.9+used[ci]++*step,0);
    m.material.color.set(col);m.material.emissive.set(col);m.material.emissiveIntensity=.35;
    m.userData.w.material.color.set(col);
    if(calm)m.position.copy(m.userData.target);
  });
  for(const [id,m] of meshes)if(!jobs.some(j=>j.id===id)){scene.remove(m);meshes.delete(id)}
  labs.forEach((d,i)=>d.lastChild.textContent=per[i]);
  $('#empty').hidden=jobs.length>0;
  $('#items').innerHTML=jobs.map(j=>`<button data-id="${j.id}">${esc(j.company)}<small>${esc(j.role)}, ${COLS.find(c=>c[0]===j.status)[1]}</small></button>`).join('');
}

function resize(){
  const w=innerWidth,h=innerHeight;
  ren.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix();
  const vw=2*Math.tan(cam.fov*Math.PI/360)*11*cam.aspect;
  spacing=Math.min(3.4,vw/5.4);unit=Math.min(1,spacing/2.2);
  rings.forEach(g=>g.scale.set(spacing*.42,1,spacing*.42));
  layout();
}
addEventListener('resize',resize);

const v=new THREE.Vector3();
function tick(ms){
  requestAnimationFrame(tick);const t=ms*.001;
  cam.position.x+=(mx*1.2-cam.position.x)*.04;
  cam.position.y+=(1.2+my*.6-cam.position.y)*.04;
  cam.lookAt(0,.2,0);
  if(!calm){stars.rotation.y=t*.01;rings.forEach((g,i)=>g.rotation.y=t*.4*(i%2?1:-1))}
  for(const m of meshes.values()){
    const u=m.userData;if(!u.target)continue;
    const tp=u.target.clone();if(!calm)tp.y+=Math.sin(t*1.2+u.ph)*.08;
    m.position.lerp(tp,calm?1:.06);
    if(!calm){m.rotation.y+=.005;m.rotation.x+=.002;u.w.rotation.y-=.01}
    const s=unit*(hover===m?1.3:1);m.scale.setScalar(m.scale.x+(s-m.scale.x)*.15);
  }
  labs.forEach((d,i)=>{v.set((i-2)*spacing,-2.3,0).project(cam);d.style.left=(v.x+1)/2*innerWidth+'px';d.style.top=(1-v.y)/2*innerHeight+'px'});
  ren.render(scene,cam);
}

/* ---------- interaction ---------- */
const ray=new THREE.Raycaster(),tip=$('#tip');
function pick(e){
  mx=e.clientX/innerWidth*2-1;my=-(e.clientY/innerHeight*2-1);
  ray.setFromCamera({x:mx,y:my},cam);
  const hit=ray.intersectObjects([...meshes.values()],false)[0];
  hover=hit?hit.object:null;
}
addEventListener('pointermove',e=>{
  pick(e);$('#c').style.cursor=hover?'pointer':'';
  if(hover){const j=hover.userData.job;tip.hidden=false;tip.innerHTML=`<b>${esc(j.company)}</b><br>${esc(j.role)}`;tip.style.transform=`translate(${e.clientX+14}px,${e.clientY+14}px)`}
  else tip.hidden=true;
});
$('#c').addEventListener('click',e=>{pick(e);if(hover)openForm(hover.userData.job)});

const dlg=$('#dlg'),f=$('#f');
function openForm(job){
  editing=job||null;f.reset();$('#del').textContent='Delete';
  $('#dt').textContent=job?'Edit application':'Add application';
  $('#del').hidden=!job;
  if(job)for(const k of ['company','role','status','location','link','notes','applied_on'])f.elements[k].value=job[k]||'';
  else f.elements.applied_on.value=new Date().toISOString().slice(0,10);
  tip.hidden=true;dlg.showModal();
}
f.addEventListener('submit',async e=>{
  e.preventDefault();
  const d=Object.fromEntries(new FormData(f));if(!d.applied_on)d.applied_on=null;
  try{editing?await api('/jobs/'+editing.id,'PUT',d):await api('/jobs','POST',d);dlg.close();await load()}
  catch{toast('Could not save. Check the fields and try again.')}
});
$('#cancel').onclick=()=>dlg.close();
$('#del').onclick=async e=>{
  if(e.target.textContent==='Delete'){e.target.textContent='Confirm delete';return}
  try{await api('/jobs/'+editing.id,'DELETE');dlg.close();await load()}catch{toast('Could not delete this application.')}
};
$('#addBtn').onclick=$('#addBtn2').onclick=()=>openForm();
$('#listBtn').onclick=e=>{const d=$('#drawer');d.hidden=!d.hidden;e.target.setAttribute('aria-expanded',!d.hidden)};
$('#items').addEventListener('click',e=>{const b=e.target.closest('button');if(b)openForm(jobs.find(j=>j.id==b.dataset.id))});

resize();load();setInterval(()=>{if(!dlg.open)load()},15000);requestAnimationFrame(tick);
</script>
</body>
</html>
